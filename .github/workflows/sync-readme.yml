name: Sync README

on:
  push:
    branches: [main]
    paths:
      - HANDOFF.md
      - .github/scripts/sync_readme.py
      - .github/workflows/sync-readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 자동 commit 무한 루프 방지: github-actions 봇이 만든 commit은 skip
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'docs(README): auto-sync') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sync script
        run: python .github/scripts/sync_readme.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "README is already in sync."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "README has been updated."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(README): auto-sync from HANDOFF.md frontmatter"
          git push
